name: Checkout Code
uses: actions/checkout@v4

    # 🔍 DIAGNOSTIC STEP: Print folder structure
    name: Debug File Paths
    run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== Root Files ==="
          ls -la
          echo "=== Searching for package.json ==="
          find . -name "package.json" -not -path "*/node_modules/*"
